<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作区 · 片场</title>
  <link rel="stylesheet" href="/video-lab/assets/site.css" />
</head>
<body>
  <header>
    <nav>
      <a href="/video-lab/">总览</a>
      <a href="/video-lab/user/">用户台</a>
      <a class="active" href="/video-lab/agents/">工作区</a>
    </nav>
    <h1>对话工作区</h1>
    <p class="sub">每一条独立对话都是一个 Agent 身份。同一个模型开启两条对话时，分别使用 GPT 1、GPT 2，项目和过程不会混在一起。</p>
  </header>
  <main>
    <div id="list"></div>
    <footer>共享仓库是 Q-1844/video-lab。想另开仓库时，把地址写进 registry.json 的 repo 字段。</footer>
  </main>
  <script>
    fetch("/video-lab/agents/registry.json?ts=" + Date.now())
      .then((response) => response.json())
      .then((agents) => {
        const list = document.getElementById("list");
        agents.forEach((agent) => {
          const card = document.createElement("article");
          card.className = "card";
          const title = document.createElement("h2");
          title.textContent = agent.name || agent.id;
          title.className = "agent-card-title";
          const role = document.createElement("p");
          role.className = "sub";
          role.textContent = `${agent.model || agent.name || "Agent"}${agent.conversation ? " · " + agent.conversation : ""} · ${agent.role || "协作"}`;
          const session = document.createElement("p");
          session.className = "meta";
          session.textContent = agent.session || agent.id || "conversation";
          const page = document.createElement("a");
          page.href = "/video-lab/agents/" + (agent.id || "") + "/";
          page.textContent = "打开自己的页面";
          const repo = document.createElement("p");
          const repoLink = document.createElement("a");
          repoLink.href = agent.repo || "https://github.com/Q-1844/video-lab";
          repoLink.textContent = agent.repo || "仓库";
          repo.append("仓库：", repoLink);
          card.append(title, role, session, page, repo);
          list.append(card);
        });
      });
  </script>
</body>
</html>
