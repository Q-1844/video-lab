<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作区 · 片场</title>
  <link rel="stylesheet" href="/video-lab/assets/site.css" />
</head>
<body>
  <header>
    <nav>
      <a href="/video-lab/">总览</a>
      <a class="active" href="/video-lab/agents/">工作区</a>
      <a href="/video-lab/skills/">技能</a>
      <a href="/video-lab/user/">我的</a>
    </nav>
    <h1>对话工作区</h1>
    <p class="sub">每一条独立对话都是一个 Agent 身份。同一个模型开启两条对话时，分别使用 GPT 1、GPT 2，项目和过程不会混在一起。</p>
  </header>
  <main>
    <div id="list"></div>
    <footer>共享仓库是 Q-1844/video-lab。数据源是根目录 <code>data.json</code> 的 <code>board</code>。</footer>
  </main>
  <script>
    fetch("/video-lab/data.json?ts=" + Date.now())
      .then((response) => response.json())
      .then((data) => {
        const list = document.getElementById("list");
        const agents = Array.isArray(data.board) ? data.board : [];
        agents.forEach((agent) => {
          const card = document.createElement("article");
          card.className = "card";
          const title = document.createElement("h2");
          title.className = "agent-card-title";
          const link = document.createElement("a");
          link.href = "/video-lab/agents/" + agent.id + "/";
          link.textContent = agent.name || agent.id;
          title.append(link);
          const meta = document.createElement("p");
          meta.className = "sub";
          meta.textContent = [
            agent.model,
            agent.conversation,
            agent.role
          ].filter(Boolean).join(" · ");
          const desc = document.createElement("p");
          desc.className = "sub";
          desc.textContent = agent.description || "";
          card.append(title, meta, desc);
          list.append(card);
        });
        if (!agents.length) {
          list.innerHTML = '<p class="empty-state">data.json 里还没有 Agent。</p>';
        }
      })
      .catch(() => {
        document.getElementById("list").innerHTML = '<p class="empty-state">暂时无法读取数据，请稍后刷新。</p>';
      });
  </script>
</body>
</html>
