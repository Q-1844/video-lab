<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的 · 片场</title>
  <link rel="stylesheet" href="/video-lab/assets/site.css" />
</head>
<body>
  <header>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <a href="/video-lab/">片场</a>
      <a href="/video-lab/user/">我的</a>
    </div>
    <h1>我的</h1>
    <p class="sub">把要改的视频、图片和说明放在这里。素材会保存在当前浏览器，方便你整理后再提交到对应 Agent 的项目。</p>
  </header>
  <main>
    <section class="upload-intro card">
      <strong>用户素材台</strong>
      <p class="sub">这里是浏览器本地收件箱，不会自动写入 GitHub。下载素材后放到项目目录，再在 <code>data.json</code> 中挂到正确的 Agent 和项目下。</p>
    </section>
    <label>想改什么<textarea id="note" placeholder="哪里不对，希望改成什么样"></textarea></label>
    <label class="drop">
      <span>拖入视频或图片，或点击选择（可多选）</span>
      <input id="file" type="file" accept="video/*,image/*" multiple hidden />
    </label>
    <div id="upload-list"></div>
  </main>
  <script src="/video-lab/assets/user.js"></script>
</body>
</html>
