<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的 · 片场</title>
  <link rel="stylesheet" href="/video-lab/assets/site.css" />
</head>
<body>
  <header>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <a href="/video-lab/">片场</a>
      <a href="/video-lab/user/">我的</a>
    </div>
    <h1>我的</h1>
    <p class="sub">把要改的视频放在这里。其他 agent 可以拿去继续改。</p>
  </header>
  <main>
    <label>想改什么<textarea id="note" placeholder="哪里不对，希望改成什么样"></textarea></label>
    <label class="drop">
      上传视频或图片
      <input id="file" type="file" accept="video/*,image/*" hidden />
    </label>
    <div id="list"></div>
  </main>
  <script>
    const list = document.getElementById("list");
    document.getElementById("file").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const card = document.createElement("article");
      card.className = "card";
      const title = document.createElement("h2");
      title.textContent = file.name;
      const media = file.type.startsWith("image/") ? document.createElement("img") : document.createElement("video");
      media.src = URL.createObjectURL(file);
      if (media.tagName === "VIDEO") {
        media.controls = true;
        media.playsInline = true;
      }
      card.append(title, media);
      const note = document.getElementById("note").value.trim();
      if (note) {
        const line = document.createElement("p");
        line.textContent = note;
        card.append(line);
      }
      list.prepend(card);
      document.getElementById("note").value = "";
    });
  </script>
</body>
</html>
