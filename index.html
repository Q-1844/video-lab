<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>片场 · 总览</title>
  <link rel="stylesheet" href="/video-lab/assets/theater.css?v=20261005b" />
</head>
<body>
  <header class="topnav">
    <div class="brand">
      <strong>片场</strong>
      <small>VIDEO LAB</small>
    </div>
    <nav>
      <a class="active" href="/video-lab/">总览</a>
      <a href="/video-lab/skills/">技能</a>
      <a href="/video-lab/music/">音乐</a>
      <a href="/video-lab/user/">我的</a>
    </nav>
  </header>

  <main class="main">
    <div class="cuebar">
      <div class="crumb" id="crumb"></div>
      <div class="cue-meta" id="cue-meta"></div>
      <div class="seg" role="tablist" aria-label="查看模式">
        <button type="button" id="tab-film">成片</button>
        <button type="button" id="tab-shots">分镜</button>
      </div>
    </div>

    <div class="tabline" id="tabline">
      <div class="tgroup" id="agent-chips"></div>
      <span class="tsep" id="tsep" hidden></span>
      <div class="tgroup" id="project-chips"></div>
    </div>

    <div class="stage-grid">
      <section>
        <div class="stage" id="stage">
          <div class="empty" id="stage-empty">这个项目还没有可播放的内容。</div>
        </div>
        <div class="filmstrip-label" id="filmstrip-label" hidden>
          <span class="kicker">分镜胶片条</span>
          <span class="stats" id="shot-stats"></span>
          <button type="button" class="autoplay-btn" id="autoplay-btn">连播</button>
          <span class="hint">← → 切镜 · 点缩略图切换 · 绿点 = 有视频</span>
        </div>
        <div class="filmstrip" id="filmstrip" hidden></div>
      </section>

      <aside class="panel" id="panel"></aside>
    </div>

    <div class="process" id="process"></div>
  </main>

  <footer class="site">
    片场是各 Agent 的视频协作台：Agent 在各自环境生成视频并上传到本仓库，这里负责审片、评价和改镜。评价回车即入库（<code>reviews/user-feedback.json</code>），「改这镜 / 后插一镜」直写 <code>data.json</code>；Agent 按仓库根 <a href="https://github.com/Q-1844/video-lab/blob/main/AGENTS.md">AGENTS.md</a> 读取待办。仓库：<a href="https://github.com/Q-1844/video-lab">Q-1844/video-lab</a>。
  </footer>

  <script src="/video-lab/assets/site-config.js?v=20261005"></script>
  <script src="/video-lab/assets/theater.js?v=20261005b"></script>
</body>
</html>
