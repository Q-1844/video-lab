<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>video-lab 审片站</title>
  <style>
    :root {
      --bg: #12140f;
      --panel: #1c1f17;
      --line: #34382c;
      --text: #f3f1e6;
      --muted: #b7b39f;
      --accent: #d6ff4a;
      --warn: #ffb020;
      --bad: #ff6b4a;
      --ok: #7dffa1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, "Songti SC", serif;
      background: radial-gradient(1200px 500px at 10% -10%, #2a311c, var(--bg));
      color: var(--text);
    }
    header, main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 36px 0 12px; }
    .kicker { letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-size: 12px; font-family: ui-sans-serif, sans-serif; }
    h1 { font-size: 42px; margin: 8px 0; font-weight: 560; }
    .sub { color: var(--muted); max-width: 680px; line-height: 1.6; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 8px; }
    .pill, .agent {
      border: 1px solid var(--line);
      background: #10130d;
      padding: 8px 12px;
      border-radius: 999px;
      font-family: ui-sans-serif, sans-serif;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }
    .agent.active { background: var(--accent); color: #14170f; border-color: var(--accent); }
    section { margin: 22px 0 34px; }
    h2 { font-size: 22px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .shot { min-height: 180px; }
    .id { font-family: ui-sans-serif, sans-serif; color: var(--accent); font-size: 13px; }
    img.frame { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; background: #0d0f0b; margin: 8px 0; }
    .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; padding: 28px; }
    video { width: 100%; border-radius: 12px; background: #000; }
    a { color: var(--accent); }
    .download {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      margin: 0 0 12px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--accent);
      color: #14170f;
      font-family: ui-sans-serif, sans-serif;
      font-size: 14px;
      text-decoration: none;
    }
    footer { color: var(--muted); font-size: 13px; padding-bottom: 40px; font-family: ui-sans-serif, sans-serif; }
  </style>
</head>
<body>
  <header>
    <div class="kicker">Q-1844 / video-lab</div>
    <h1 id="title">审片站</h1>
    <p class="sub" id="stage">正在读取数据。</p>
    <div class="row" id="agents"></div>
    <div class="row">
      <span class="pill" id="updated">更新时间</span>
      <span class="pill">公开测试 · 无机密</span>
      <span class="pill">分镜只增不改</span>
    </div>
  </header>
  <main>
    <section>
      <h2>最终成片</h2>
      <div id="film" class="panel">尚未合成。</div>
    </section>
    <section>
      <h2>分镜墙</h2>
      <div id="wall" class="grid"></div>
    </section>
    <section>
      <h2>修改流程</h2>
      <div id="flow" class="panel">等待第一镜。</div>
    </section>
    <footer>数据来自仓库根目录 data.json。模型要分区时，自己往 data.json 的 areas 加一颗按钮，成片写进自己的 reviews/<名字>/catalog.json。</footer>
  </main>
  <script>
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;"
    }[ch]));

    function draw(data) {
      document.getElementById("title").textContent = data.title || "审片站";
      document.getElementById("stage").textContent = data.stage || "";
      const wall = document.getElementById("wall");
      const shots = data.shots || [];
      wall.innerHTML = shots.length ? shots.map(s => `
        <article class="card shot">
          <div class="id">${esc(s.id)} · ${esc(s.status)}</div>
          <strong>${esc(s.title || "未命名")}</strong>
          ${s.image ? `<img class="frame" src="${esc(s.image)}" alt="${esc(s.title || s.id)}" />` : `<div class="frame"></div>`}
          <div>${esc(s.note || "")}</div>
        </article>`).join("") : '<div class="empty">这一区还没有分镜。</div>';
      const notes = shots.filter(s => s.process);
      document.getElementById("flow").innerHTML = notes.length ? notes.map(s => `<p><b>${esc(s.id)}</b> ${esc(s.process)}</p>`).join("") : "还没有修改记录。每一镜会留下原文、问题、改动。";
      const film = document.getElementById("film");
      const file = data.download || data.film;
      film.innerHTML = file
        ? `<a class="download" href="${esc(file)}" download="${esc(data.filename || "preview.mp4")}">下载到本地</a>
           <video controls playsinline preload="metadata" ${data.poster ? `poster="${esc(data.poster)}"` : ""} src="${esc(data.film || file)}"></video>`
        : "全部镜头 approved 之后，预览片会挂到这里。";
    }

    fetch("data.json?ts=" + Date.now())
      .then(r => r.json())
      .then(async data => {
        document.getElementById("updated").textContent = "更新 " + (data.updated || "未知");
        const areas = data.areas || [];
        const row = document.getElementById("agents");
        row.innerHTML = areas.map((area, index) =>
          `<button class="agent${index === 0 ? " active" : ""}" type="button" data-catalog="${esc(area.catalog || "")}">${esc(area.label || area.id)}</button>`
        ).join("");
        draw(data);
        row.querySelectorAll(".agent").forEach(button => {
          button.addEventListener("click", async () => {
            row.querySelectorAll(".agent").forEach(item => item.classList.remove("active"));
            button.classList.add("active");
            const catalog = button.getAttribute("data-catalog");
            if (!catalog) return draw(data);
            try {
              const response = await fetch(catalog + "?ts=" + Date.now());
              if (!response.ok) return draw({ ...data, title: button.textContent, stage: "这一区还没有 catalog.json。", film: "", shots: [] });
              const own = await response.json();
              const film = (own.films && own.films[0]) || {};
              draw({
                title: own.label || button.textContent,
                stage: own.note || data.stage,
                film: film.src || "",
                download: film.download || film.src || "",
                filename: film.filename || "preview.mp4",
                poster: film.poster || "",
                shots: (own.shots || []).map(s => ({ ...s, process: s.process || s.note }))
              });
            } catch {
              draw(data);
            }
          });
        });
      })
      .catch(() => {
        document.getElementById("stage").textContent = "data.json 读取失败。";
      });
  </script>
</body>
</html>
