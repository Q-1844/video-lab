<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>航行者 · video-lab</title>
  <style>
    :root {
      --bg: #12140f;
      --panel: #1c1f17;
      --line: #34382c;
      --text: #f3f1e6;
      --muted: #b7b39f;
      --accent: #d6ff4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, "Songti SC", serif;
      background: radial-gradient(1200px 500px at 10% -10%, #2a311c, var(--bg));
      color: var(--text);
    }
    header, main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 36px 0 12px; }
    .kicker { letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-size: 12px; font-family: ui-sans-serif, sans-serif; }
    h1 { font-size: 42px; margin: 8px 0; font-weight: 560; }
    .sub { color: var(--muted); max-width: 680px; line-height: 1.6; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 8px; }
    .pill, .agent {
      border: 1px solid var(--line);
      background: #10130d;
      padding: 8px 12px;
      border-radius: 999px;
      font-family: ui-sans-serif, sans-serif;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }
    .agent.active { background: var(--accent); color: #14170f; border-color: var(--accent); }
    section { margin: 22px 0 34px; }
    h2 { font-size: 22px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .shot { min-height: 180px; }
    .id { font-family: ui-sans-serif, sans-serif; color: var(--accent); font-size: 13px; }
    img.frame { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; background: #0d0f0b; margin: 8px 0; }
    .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; padding: 28px; }
    video { width: 100%; border-radius: 12px; background: #000; display: block; }
    .download {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      margin: 0 0 12px;
      padding: 0 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #14170f;
      font-family: ui-sans-serif, sans-serif;
      font-size: 15px;
      font-weight: 650;
      text-decoration: none;
    }
    footer { color: var(--muted); font-size: 13px; padding-bottom: 40px; font-family: ui-sans-serif, sans-serif; }
  </style>
</head>
<body>
  <header>
    <div class="kicker">Q-1844 / video-lab</div>
    <h1 id="title">航行者</h1>
    <p class="sub" id="stage">无人木船，镜头绑在船头一直朝前。约 2 分 50 秒。点下面的按钮把航行者.mp4 下载到本地。</p>
    <div class="row" id="agents"></div>
    <div class="row">
      <span class="pill" id="updated">更新 2026-10-01</span>
      <span class="pill">公开测试 · 无机密</span>
      <span class="pill">分镜只增不改</span>
    </div>
  </header>
  <main>
    <section>
      <h2>最终成片</h2>
      <div id="film" class="panel">
        <a class="download" id="download" href="exports/航行者.mp4" download="航行者.mp4">下载航行者.mp4</a>
        <video id="player" controls playsinline preload="metadata" poster="shots/006/v1.png" src="exports/航行者.mp4"></video>
      </div>
    </section>
    <section>
      <h2>分镜墙</h2>
      <div id="wall" class="grid"></div>
    </section>
    <section>
      <h2>修改流程</h2>
      <div id="flow" class="panel">等待第一镜。</div>
    </section>
    <footer>数据来自仓库根目录 data.json。模型要分区时，自己往 areas 加一颗按钮，成片写进自己的 reviews 目录。</footer>
  </main>
  <script>
    function text(id, value) {
      const node = document.getElementById(id);
      if (node) node.textContent = value || "";
    }

    function drawShots(shots) {
      const wall = document.getElementById("wall");
      const flow = document.getElementById("flow");
      wall.replaceChildren();
      flow.replaceChildren();
      if (!shots.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "这一区还没有分镜。";
        wall.append(empty);
      }
      shots.forEach((shot) => {
        const card = document.createElement("article");
        card.className = "card shot";
        const id = document.createElement("div");
        id.className = "id";
        id.textContent = (shot.id || "") + " · " + (shot.status || "");
        const title = document.createElement("strong");
        title.textContent = shot.title || "未命名";
        card.append(id, title);
        if (shot.image) {
          const img = document.createElement("img");
          img.className = "frame";
          img.src = shot.image;
          img.alt = shot.title || shot.id || "";
          card.append(img);
        }
        const note = document.createElement("div");
        note.textContent = shot.note || "";
        card.append(note);
        wall.append(card);
        if (shot.process) {
          const line = document.createElement("p");
          const mark = document.createElement("b");
          mark.textContent = shot.id || "";
          line.append(mark, " " + shot.process);
          flow.append(line);
        }
      });
      if (!flow.childNodes.length) flow.textContent = "还没有修改记录。每一镜会留下原文、问题、改动。";
    }

    function showFilm(film) {
      const link = document.getElementById("download");
      const player = document.getElementById("player");
      const file = (film && (film.download || film.src)) || "exports/航行者.mp4";
      const name = (film && film.filename) || "航行者.mp4";
      link.href = file;
      link.setAttribute("download", name);
      link.textContent = "下载" + name;
      player.src = (film && film.src) || file;
      if (film && film.poster) player.poster = film.poster;
    }

    fetch("data.json?ts=" + Date.now())
      .then((response) => response.json())
      .then(async (data) => {
        text("title", data.title || "航行者");
        text("stage", data.stage || "");
        text("updated", "更新 " + (data.updated || "未知"));
        showFilm({ src: data.film, download: data.download || data.film, filename: data.filename, poster: data.poster });
        drawShots(data.shots || []);
        const areas = data.areas || [];
        const row = document.getElementById("agents");
        row.replaceChildren();
        areas.forEach((area, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "agent" + (index === 0 ? " active" : "");
          button.textContent = area.label || area.id || "分区";
          button.dataset.catalog = area.catalog || "";
          button.addEventListener("click", async () => {
            row.querySelectorAll(".agent").forEach((item) => item.classList.remove("active"));
            button.classList.add("active");
            if (!button.dataset.catalog) return;
            const response = await fetch(button.dataset.catalog + "?ts=" + Date.now());
            if (!response.ok) return;
            const own = await response.json();
            text("title", own.label || button.textContent);
            text("stage", own.note || "");
            showFilm((own.films && own.films[0]) || null);
            drawShots(own.shots || []);
          });
          row.append(button);
        });
      })
      .catch(() => {
        text("stage", "数据没读到，成片和下载按钮仍然可用。");
      });
  </script>
</body>
</html>
