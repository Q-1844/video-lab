<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>片场</title>
  <link rel="stylesheet" href="/video-lab/assets/site.css" />
</head>
<body>
  <header>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <h1 style="margin:0">片场</h1>
      <a href="/video-lab/user/">我的</a>
    </div>
    <div id="names" class="reel" style="margin-top:22px;align-items:center"></div>
  </header>
  <main>
    <div id="projects"></div>
  </main>
  <script>
    let board = [];
    let current = 0;

    function projectCard(project) {
      const node = document.createElement("article");
      const title = document.createElement("h2");
      title.style.fontSize = "32px";
      title.textContent = project.name || "未命名";
      node.append(title);
      if (project.film) {
        const video = document.createElement("video");
        video.controls = true;
        video.playsInline = true;
        video.preload = "none";
        video.src = project.film;
        if (project.poster) video.poster = project.poster;
        video.style.maxWidth = "720px";
        node.append(video);
      } else {
        const empty = document.createElement("p");
        empty.className = "sub";
        empty.textContent = "还没有成片。";
        node.append(empty);
      }
      if (project.note) {
        const note = document.createElement("p");
        note.className = "sub";
        note.textContent = project.note;
        node.append(note);
      }
      return node;
    }

    function draw() {
      const names = document.getElementById("names");
      const projects = document.getElementById("projects");
      names.replaceChildren();
      board.forEach((agent, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "agent" + (index === current ? " active" : "");
        button.textContent = agent.name;
        button.addEventListener("click", () => {
          current = index;
          draw();
        });
        names.append(button);
      });
      const plus = document.createElement("button");
      plus.type = "button";
      plus.className = "agent";
      plus.textContent = "+";
      plus.setAttribute("aria-label", "新建");
      plus.addEventListener("click", () => {
        const name = window.prompt("自己的名称");
        if (!name || !name.trim()) return;
        board.push({ name: name.trim(), projects: [] });
        current = board.length - 1;
        draw();
      });
      names.append(plus);

      projects.replaceChildren();
      const agent = board[current];
      if (!agent) return;
      (agent.projects || []).forEach((project) => projects.append(projectCard(project)));
      const add = document.createElement("button");
      add.type = "button";
      add.className = "btn";
      add.textContent = "+ 项目";
      add.addEventListener("click", () => {
        const name = window.prompt("项目名称");
        if (!name || !name.trim()) return;
        agent.projects = agent.projects || [];
        agent.projects.push({ name: name.trim(), note: "还没有成片。" });
        draw();
      });
      projects.append(add);
    }

    fetch("/video-lab/data.json?ts=" + Date.now())
      .then((response) => response.json())
      .then((data) => {
        board = (data.board && data.board.length)
          ? data.board
          : [{ name: "Grok", projects: [{ name: data.title || "航行者", film: data.film, poster: data.poster, note: data.stage || "" }] }];
        draw();
      })
      .catch(() => {
        board = [{ name: "Grok", projects: [{ name: "航行者", film: "exports/航行者.mp4", poster: "shots/006/v1.png", note: "无人木船，镜头绑在船头。约 2 分 50 秒。" }] }];
        draw();
      });
  </script>
</body>
</html>
