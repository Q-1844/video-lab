<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>片场 · video-lab</title>
  <link rel="stylesheet" href="/video-lab/assets/site.css" />
</head>
<body>
  <header>
    <nav>
      <a class="active" href="/video-lab/">总览</a>
      <a href="/video-lab/user/">用户台</a>
      <a href="/video-lab/agents/">工作区</a>
    </nav>
    <h1 id="title">片场</h1>
    <p class="sub" id="stage">正在读取仓库。</p>
    <div id="agents" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"></div>
  </header>
  <main>
    <div id="board"></div>
    <footer>从左到右是分镜，最后一格是成片。用户把要改的视频传到用户台。</footer>
  </main>
  <script>
    const board = document.getElementById("board");

    function shotCard(shot) {
      const node = document.createElement("article");
      node.className = "card";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = (shot.id || "") + (shot.status ? " · " + shot.status : "");
      const title = document.createElement("h2");
      title.textContent = shot.title || "未命名";
      node.append(meta, title);
      if (shot.image) {
        const img = document.createElement("img");
        img.src = shot.image;
        img.alt = shot.title || "";
        node.append(img);
      }
      const note = document.createElement("p");
      note.textContent = shot.note || "";
      node.append(note);
      return node;
    }

    function filmCard(film) {
      const node = document.createElement("article");
      node.className = "card film";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "成片";
      node.append(meta);
      const file = (film && (film.src || film.download)) || "";
      if (!file) {
        const empty = document.createElement("p");
        empty.textContent = "尚未合成。";
        node.append(empty);
        return node;
      }
      const video = document.createElement("video");
      video.controls = true;
      video.playsInline = true;
      video.preload = "none";
      video.src = film.src || file;
      if (film.poster) video.poster = film.poster;
      const name = document.createElement("h2");
      name.textContent = film.filename || "成片";
      node.append(video, name);
      return node;
    }

    function draw(data) {
      const shots = data.shots || [];
      document.getElementById("title").textContent = data.title || "片场";
      document.getElementById("stage").textContent = data.stage || data.note || "";
      const reel = document.createElement("div");
      reel.className = "reel";
      reel.append(shotCard({
        id: "任务",
        title: "简报",
        status: "",
        note: data.stage || data.note || "",
        image: data.poster || (shots[0] && shots[0].image) || ""
      }));
      shots.forEach((shot) => reel.append(shotCard(shot)));
      reel.append(filmCard({
        src: data.film || (data.films && data.films[0] && data.films[0].src),
        filename: data.filename || (data.films && data.films[0] && data.films[0].filename),
        poster: data.poster || (data.films && data.films[0] && data.films[0].poster)
      }));
      const notes = document.createElement("div");
      shots.forEach((shot) => {
        if (!shot.process) return;
        const line = document.createElement("p");
        line.textContent = shot.id + "  " + shot.process;
        notes.append(line);
      });
      board.replaceChildren(reel, notes);
    }

    fetch("/video-lab/data.json?ts=" + Date.now())
      .then((response) => response.json())
      .then((data) => {
        draw(data);
        const row = document.getElementById("agents");
        (data.areas || []).forEach((area, index) => {
          const link = document.createElement("a");
          link.className = "agent" + (index === 0 ? " active" : "");
          link.href = area.page ? ("/video-lab/" + area.page.replace(/^\//, "")) : "/video-lab/agents/";
          link.textContent = (area.label || area.id || "分区") + " 的页面";
          row.append(link);
        });
        const user = document.createElement("a");
        user.href = "/video-lab/user/";
        user.textContent = "上传要改的片子";
        row.append(user);
      })
      .catch(() => {
        document.getElementById("stage").textContent = "数据没读到。";
      });
  </script>
</body>
</html>
